<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#12090f">
  <title>ضیافت آخر</title>
  <link rel="preload" href="/fonts/lalezar-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/vazirmatn-arabic-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="/play.css">
</head>
<body>
  <div class="backdrop phone">
    <section id="join" class="join hidden">
      <div class="join-eyebrow" id="joinEyebrow">شب یلدا · شیراز · عمارت فرهمند</div>
      <h1 class="display join-title" id="joinTitle">ضیافت آخر</h1>
      <p class="join-tag" data-i18n="یکی از ما قاتل است.">یکی از ما قاتل است.</p>
      <form id="joinForm" autocomplete="off">
        <label for="nameInput" data-i18n="اسمت چیست؟">اسمت چیست؟</label>
        <input id="nameInput" maxlength="14" placeholder="مثلاً: سام" data-i18n-ph="مثلاً: سام" enterkeyhint="go">
        <button class="btn primary big" type="submit" data-i18n="ورود به مهمانی">ورود به مهمانی</button>
        <div id="joinError" class="error"></div>
      </form>
    </section>

    <!-- latecomers: the public game, watch-only, until the next lobby -->
    <section id="watch" class="watch hidden">
      <div id="watchHead"></div>
      <!-- static, so typing a name survives re-renders; the seats list is redrawn -->
      <div id="takeover" class="action takeover hidden">
        <div class="sec-title" data-i18n="جای یک نفر خالی شده">جای یک نفر خالی شده</div>
        <p class="sub" data-i18n="گوشی یک بازیکن قطع شده. می‌توانی با اجازه‌ی میزبان نقش او را ادامه بدهی.">گوشی یک بازیکن قطع شده. می‌توانی با اجازه‌ی میزبان نقش او را ادامه بدهی.</p>
        <input id="takeName" maxlength="14" placeholder="اسمت" data-i18n-ph="اسمت" enterkeyhint="done">
        <div id="takeSeats"></div>
      </div>
      <div id="watchBody"></div>
    </section>

    <section id="game" class="hidden">
      <header class="ph-top">
        <div id="meChip" class="me-chip"></div>
        <div class="ph-phase"><div id="phPhase" class="display"></div><div id="phRound" class="muted"></div></div>
        <div class="ph-timer" data-timer><span data-timer-label></span></div>
      </header>
      <section id="action" class="action"></section>
      <nav id="tabs" class="tabs"></nav>
      <section id="tabBody" class="tab-body"></section>
      <div id="vipBar" class="vip-bar hidden"></div>
    </section>

    <div id="toast" class="toast hidden"></div>
    <div id="offline" class="offline hidden" data-i18n="اتصال قطع شد… در حال اتصال دوباره">اتصال قطع شد… در حال اتصال دوباره</div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/i18n.js"></script>
  <script src="/shared.js"></script>
  <script src="/art.js"></script>
  <script src="/faces.js"></script>
  <script src="/guide.js"></script>
  <script src="/vendor/nosleep.js"></script>
  <script src="/play.js"></script>
</body>
</html>
